name: Tests (CPU)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-cpu:
    name: pytest (no GPU, no Vina)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CPU-only torch (CI doesn't have CUDA)
        run: |
          uv pip install --system torch==2.0.1+cpu --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Install package + dev deps
        run: uv pip install --system -e ".[dev]"

      - name: Run unit tests (no GPU, no Vina binary required)
        run: pytest -m "not gpu and not vina and not slow" --cov=kinetidiff --cov-report=xml -v

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
