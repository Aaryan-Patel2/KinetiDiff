name: Feature Request
description: Suggest an improvement or new feature
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a feature request, check [existing issues](https://github.com/Aaryan-Patel2/kinetidiff/issues)
        and [discussions](https://github.com/Aaryan-Patel2/kinetidiff/discussions).

  - type: dropdown
    id: area
    attributes:
      label: Feature area
      options:
        - Guidance (new oracle / scoring function)
        - Generation (sampling strategy)
        - MD pipeline
        - Packaging / installation
        - Documentation
        - Performance
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case and why the current behaviour is insufficient.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see? Pseudocode or examples welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've thought about?
